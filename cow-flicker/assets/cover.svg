<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Arial Rounded MT Bold','Baloo 2',system-ui,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f2"/><stop offset=".55" stop-color="#d9f0fa"/><stop offset="1" stop-color="#e8f6ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cb84f"/><stop offset=".4" stop-color="#6da544"/><stop offset="1" stop-color="#5a8f38"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <!-- clouds -->
  <g fill="#fff" opacity=".9">
    <g transform="translate(150,120)"><rect x="0" y="0" width="120" height="34" rx="18"/><circle cx="34" cy="4" r="26"/><circle cx="78" cy="10" r="20"/></g>
    <g transform="translate(980,80) scale(1.3)"><rect x="0" y="0" width="120" height="34" rx="18"/><circle cx="34" cy="4" r="26"/><circle cx="78" cy="10" r="20"/></g>
    <g transform="translate(760,180) scale(.7)" opacity=".8"><rect x="0" y="0" width="120" height="34" rx="18"/><circle cx="34" cy="4" r="26"/><circle cx="78" cy="10" r="20"/></g>
  </g>
  <rect x="0" y="500" width="1280" height="220" fill="url(#grass)"/>
  <rect x="0" y="500" width="1280" height="8" fill="#4e7d30"/>

  <!-- COW (facing front, on the right) -->
  <g transform="translate(830,300) scale(1.7)">
    <rect x="86" y="150" width="22" height="60" rx="8" fill="#f4efe6"/>
    <rect x="190" y="150" width="22" height="60" rx="8" fill="#f4efe6"/>
    <rect x="86" y="196" width="22" height="16" rx="4" fill="#26262b"/>
    <rect x="190" y="196" width="22" height="16" rx="4" fill="#26262b"/>
    <ellipse cx="150" cy="140" rx="92" ry="62" fill="#fbf7ef" stroke="#26262b" stroke-width="4"/>
    <path d="M96 120 q-16 26 8 44 q26 10 30-18 q2-30-38-26z" fill="#2a2a2e"/>
    <path d="M188 108 q30 4 26 34 q-6 24-32 14 q-16-30 6-48z" fill="#2a2a2e"/>
    <g><ellipse cx="150" cy="190" rx="30" ry="22" fill="#f6b9c2" stroke="#d98a97" stroke-width="2.5"/>
      <rect x="129" y="203" width="8" height="15" rx="4" fill="#eda4b0"/><rect x="146" y="206" width="8" height="17" rx="4" fill="#eda4b0"/><rect x="163" y="203" width="8" height="15" rx="4" fill="#eda4b0"/></g>
    <ellipse cx="150" cy="86" rx="56" ry="48" fill="#fbf7ef" stroke="#26262b" stroke-width="4"/>
    <ellipse cx="98" cy="66" rx="16" ry="10" fill="#fbf7ef" stroke="#26262b" stroke-width="3" transform="rotate(-24 98 66)"/>
    <ellipse cx="202" cy="66" rx="16" ry="10" fill="#fbf7ef" stroke="#26262b" stroke-width="3" transform="rotate(24 202 66)"/>
    <path d="M116 46 q-8-16 4-24" stroke="#d9c9a3" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M184 46 q8-16-4-24" stroke="#d9c9a3" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="128" cy="80" r="10" fill="#fff" stroke="#26262b" stroke-width="2"/>
    <circle cx="172" cy="80" r="10" fill="#fff" stroke="#26262b" stroke-width="2"/>
    <circle cx="131" cy="83" r="5" fill="#26262b"/><circle cx="169" cy="83" r="5" fill="#26262b"/>
    <path d="M118 66 l20 8" stroke="#26262b" stroke-width="4" stroke-linecap="round"/>
    <path d="M182 66 l-20 8" stroke="#26262b" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="150" cy="108" rx="30" ry="20" fill="#f4b8bf" stroke="#26262b" stroke-width="3"/>
    <circle cx="140" cy="106" r="4" fill="#26262b"/><circle cx="160" cy="106" r="4" fill="#26262b"/>
    <path d="M138 120 q12 -8 24 0" stroke="#26262b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="150" y="30" font-size="26" text-anchor="middle">💢</text>
  </g>

  <!-- milk splat accent -->
  <g fill="#fbfbf7" opacity=".95" transform="translate(150,470)">
    <ellipse cx="70" cy="60" rx="70" ry="52"/><ellipse cx="20" cy="30" rx="28" ry="22"/><ellipse cx="120" cy="34" rx="30" ry="24"/><circle cx="10" cy="90" r="12"/><circle cx="130" cy="96" r="14"/>
    <text x="60" y="76" font-size="44" text-anchor="middle">🥛</text>
  </g>

  <!-- Title -->
  <text x="70" y="250" font-size="118" fill="#fff" stroke="#26262b" stroke-width="9" paint-order="stroke" letter-spacing="1">COW</text>
  <text x="70" y="360" font-size="118" fill="#f2c14e" stroke="#26262b" stroke-width="9" paint-order="stroke" letter-spacing="1">FLICKER</text>
  <text x="74" y="404" font-size="26" fill="#26262b" letter-spacing="1">She never dies. She just gets madder.</text>

  <!-- weapon row -->
  <g transform="translate(70,430)">
    <rect x="0" y="0" width="360" height="58" rx="18" fill="#fffdf7" stroke="#e7ddc7" stroke-width="3"/>
    <text x="30" y="42" font-size="34">👆</text><text x="95" y="42" font-size="34">🥍</text><text x="160" y="42" font-size="34">🏏</text><text x="225" y="42" font-size="34">🥊</text><text x="290" y="42" font-size="34">🤚</text>
  </g>
  <text x="72" y="560" font-size="22" fill="#1c4a1c" font-weight="bold">🔓 20 secret animations to discover</text>
