<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>AInovations CRM</title>
<style>
:root{
  --bg:#05121f; --bg-deep:#030b14; --panel:rgba(255,255,255,.06); --panel-2:rgba(255,255,255,.09);
  --text:#f7fbff; --muted:#b8cad7; --teal:#1dc8c6; --teal-dark:#078c92; --teal-soft:#72e6df;
  --blue:#46a6ff; --border:rgba(255,255,255,.13);
  --green:#3ddc97; --amber:#ffc14d; --red:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg-deep); color:var(--text); min-height:100vh;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
a{color:var(--teal-soft)}

/* ---------- shell ---------- */
.topbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 18px;background:var(--bg);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:30;
}
.brand{font-weight:800;letter-spacing:.02em;font-size:15px}
.brand span{color:var(--teal)}
.topbar .spacer{flex:1 1 auto}
.who{color:var(--muted);font-size:13px}

.btn{
  border:1px solid var(--border);background:var(--panel);color:var(--text);
  border-radius:9px;padding:8px 13px;font-size:13.5px;font-weight:600;
}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--teal-dark);border-color:var(--teal-dark)}
.btn.primary:hover{background:var(--teal);color:#032027}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 9px;font-size:12.5px}

.wrap{padding:18px;max-width:1500px;margin:0 auto}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px;min-width:0}
.stat b{display:block;font-size:24px;line-height:1.15;letter-spacing:-.01em}
.stat small{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em}
.stat.accent b{color:var(--teal)}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.card>h2{
  margin:0;padding:12px 15px;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;
}
.card>h2 .spacer{flex:1 1 auto}
.card-body{padding:15px}

/* ---------- list ---------- */
.filters{display:flex;gap:8px;padding:11px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.filters input,.filters select{
  background:var(--bg-deep);border:1px solid var(--border);border-radius:8px;padding:7px 9px;
  font-size:13px;min-width:0;
}
.filters input{flex:1 1 120px}
.filters select{flex:0 1 auto;max-width:100%}

.rows{max-height:64vh;overflow-y:auto}
.row{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);
}
.row:hover{background:var(--panel-2)}
.row.on{background:rgba(29,200,198,.13);box-shadow:inset 3px 0 0 var(--teal)}
.row .name{font-weight:650;display:flex;gap:8px;align-items:baseline}
.row .no{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.row .sub{color:var(--muted);font-size:12.5px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:26px 16px;color:var(--muted);text-align:center;font-size:13.5px}

.pill{
  display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  padding:2px 7px;border-radius:999px;border:1px solid var(--border);white-space:nowrap;
}
.pill.lead{color:var(--muted)}
.pill.contacted{color:var(--blue);border-color:rgba(70,166,255,.45)}
.pill.proposal{color:var(--amber);border-color:rgba(255,193,77,.45)}
.pill.won,.pill.active{color:var(--green);border-color:rgba(61,220,151,.45)}
.pill.paused{color:var(--amber);border-color:rgba(255,193,77,.4)}
.pill.churned,.pill.lost{color:var(--red);border-color:rgba(255,107,107,.4)}
.pill.paid{color:var(--green);border-color:rgba(61,220,151,.45)}
.pill.open{color:var(--amber);border-color:rgba(255,193,77,.45)}
.pill.draft,.pill.void{color:var(--muted)}
.pill.uncollectible,.pill.past_due{color:var(--red);border-color:rgba(255,107,107,.4)}

/* ---------- detail ---------- */
.detail-head{padding:15px;border-bottom:1px solid var(--border)}
.detail-head h1{margin:0 0 4px;font-size:21px;letter-spacing:-.01em}
.detail-head .meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.money{font-variant-numeric:tabular-nums}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:11px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.f input,.f select,.f textarea{
  background:var(--bg-deep);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  font-size:13.5px;width:100%;min-width:0;
}
.f textarea{resize:vertical;min-height:70px}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--teal-dark);outline-offset:-1px}

.tabs{display:flex;gap:2px;padding:0 15px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{
  border:0;background:transparent;color:var(--muted);padding:11px 12px;font-size:13px;font-weight:650;
  border-bottom:2px solid transparent;white-space:nowrap;
}
.tab.on{color:var(--text);border-bottom-color:var(--teal)}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{
  text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  padding:7px 9px;border-bottom:1px solid var(--border);font-weight:700;
}
.tbl td{padding:8px 9px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll-x{overflow-x:auto}

.note{background:var(--bg-deep);border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:9px}
.note.pin{border-color:rgba(29,200,198,.4)}
.note .when{color:var(--muted);font-size:11.5px;display:flex;gap:8px;align-items:center;margin-bottom:5px}
.note .when .spacer{flex:1 1 auto}
.note p{margin:0;white-space:pre-wrap}

.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:9px 0 9px 14px;border-left:2px solid var(--border);position:relative}
.timeline li:before{
  content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;border-radius:50%;
  background:var(--teal-dark);
}
.timeline .when{color:var(--muted);font-size:11.5px}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{
  width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);
  border-radius:16px;padding:26px;
}
.login h1{margin:0 0 6px;font-size:22px}
.login h1 span{color:var(--teal)}
.login p.hint{margin:0 0 20px;color:var(--muted);font-size:13px}
.login .f{margin-bottom:13px}
.login .btn{width:100%;padding:11px}

.msg{border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:13px;display:none}
.msg.show{display:block}
.msg.err{background:rgba(255,107,107,.14);border:1px solid rgba(255,107,107,.4);color:#ffc9c9}
.msg.ok{background:rgba(61,220,151,.14);border:1px solid rgba(61,220,151,.4);color:#c4f5df}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:100;
  background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 16px;
  font-size:13.5px;box-shadow:0 18px 44px rgba(0,0,0,.5);display:none;max-width:92vw;
}
.toast.show{display:block}
.toast.err{border-color:rgba(255,107,107,.5);color:#ffc9c9}

dialog{
  border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:14px;
  padding:0;max-width:min(92vw,760px);width:100%;
}
dialog::backdrop{background:rgba(3,11,20,.72)}
dialog h2{margin:0;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--border)}
dialog .dlg-body{padding:16px;max-height:66vh;overflow-y:auto}
dialog .dlg-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end}
.hidden{display:none !important}
.spin{color:var(--muted);font-size:13px}

/* ---------- view switcher + money view ---------- */
.viewnav{display:flex;gap:2px;background:var(--bg-deep);border:1px solid var(--border);border-radius:9px;padding:2px}
.vbtn{
  border:0;background:transparent;color:var(--muted);border-radius:7px;
  padding:6px 13px;font-size:13px;font-weight:650;
}
.vbtn.on{background:var(--panel-2);color:var(--text)}

.yearpick{
  background:var(--bg-deep);border:1px solid var(--border);border-radius:8px;
  padding:5px 8px;font-size:12.5px;
}

.entry{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:11px;
  background:var(--bg-deep);border:1px solid var(--border);border-radius:11px;
  padding:14px;margin-bottom:18px;align-items:end;
}
.entry .f label{white-space:nowrap}
.entry .check{flex-direction:row;align-items:center;gap:7px;padding-bottom:9px}
.entry .check input{width:auto;min-width:0}
.entry .check label{text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)}
.entry .go{align-self:end}
.entry .go .btn{width:100%;padding:9px}
.entry input[type=file]{padding:6px 8px;font-size:12px}
.entry input[type=file]::file-selector-button{
  background:var(--panel-2);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:3px 8px;margin-right:8px;font-size:12px;cursor:pointer;
}
.btn.rcpt{border-color:rgba(29,200,198,.45);color:var(--teal-soft)}
.rcell{white-space:nowrap}
.rcell .btn,.rcell label{margin-right:4px}

.rate-note{color:var(--muted);font-size:12px;margin:-8px 0 16px}
.rate-note b{color:var(--amber)}
.tot{font-variant-numeric:tabular-nums;font-weight:700}
.tbl tfoot td{border-top:1px solid var(--border);border-bottom:0;font-weight:700;padding-top:10px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login" id="loginView">
  <form id="loginForm">
    <h1>AI<span>novations</span> CRM</h1>
    <p class="hint">Internal back office. Authorized accounts only.</p>
    <div class="msg err" id="loginMsg"></div>
    <div class="f">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
    </div>
    <div class="f">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="appView" class="hidden">
  <div class="topbar">
    <div class="brand">AI<span>novations</span> CRM</div>
    <div class="viewnav">
      <button class="vbtn on" data-view="clients">Clients</button>
      <button class="vbtn" data-view="money">Expenses</button>
    </div>
    <div class="spacer"></div>
    <span id="clientTools">
      <button class="btn sm" id="btnProspects">Prospects</button>
      <button class="btn sm" id="btnSync">Sync Stripe</button>
      <button class="btn sm primary" id="btnNew">+ Client</button>
    </span>
    <span class="who" id="whoami"></span>
    <button class="btn sm ghost" id="btnOut">Sign out</button>
  </div>

  <div class="wrap" id="clientsView">
    <div class="stats" id="stats"></div>

    <div class="cols">
      <div class="card">
        <div class="filters">
          <input id="q" type="search" placeholder="Search name, town, email…">
          <select id="fStatus">
            <option value="">All statuses</option>
            <option value="open">Open pipeline</option>
            <option value="lead">Lead</option>
            <option value="contacted">Contacted</option>
            <option value="proposal">Proposal</option>
            <option value="won">Won</option>
            <option value="active">Active</option>
            <option value="paused">Paused</option>
            <option value="churned">Churned</option>
            <option value="lost">Lost</option>
          </select>
        </div>
        <div class="rows" id="rows"></div>
      </div>

      <div class="card" id="detail">
        <div class="empty">Pick a client on the left, or add one.</div>
      </div>
    </div>
  </div>

  <div class="wrap hidden" id="moneyView">
    <div class="stats" id="moneyStats"></div>

    <div class="card">
      <h2>
        <span id="moneyTitle">Expenses</span>
        <span class="spacer"></span>
        <select id="yearPick" class="yearpick"></select>
      </h2>
      <div class="tabs">
        <button class="tab on" data-mtab="expenses">Expenses</button>
        <button class="tab" data-mtab="mileage">Mileage</button>
      </div>
      <div class="card-body" id="moneyBody"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<dialog id="prospectDlg">
  <h2>Prospect queue — convert to client</h2>
  <div class="dlg-body" id="prospectBody"><p class="spin">Loading…</p></div>
  <div class="dlg-foot"><button class="btn" id="prospectClose">Close</button></div>
</dialog>

<script>
/* ========================================================================
   AInovations CRM — front end.
   Auth goes straight to Supabase's REST auth endpoint; every data request
   goes to /api/crm, which re-verifies the token server-side before it
   touches the database. The publishable key below grants no data access
   (RLS denies all) — it only permits sign-in.
   ===================================================================== */
const SUPABASE_URL = 'https://ptipedxvsekwoehfalux.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_9vGY3VFuLporcFm3zovVEw_9mPYjVWQ';
const API = '/api/crm';
const STORE = 'ain_crm_session';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const money = (cents) => cents == null ? '—'
  : '$' + (cents / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = (cents) => cents == null ? '—'
  : '$' + Math.round(cents / 100).toLocaleString('en-US');
// A bare YYYY-MM-DD parses as UTC midnight, which renders as the previous day
// anywhere west of Greenwich. Build those as local dates instead.
const date = (iso) => {
  if (!iso) return '—';
  const bare = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  const d = bare
    ? new Date(Number(bare[1]), Number(bare[2]) - 1, Number(bare[3]))
    : new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
};
const datetime = (iso) => !iso ? '—'
  : new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

let session = null;
let state = { clients: [], openInvoices: [], prospectCount: 0, stripeConfigured: false };
let selectedId = null;
let detailTab = 'notes';
let detailData = null;

function toast(text, isErr) {
  const t = $('toast');
  t.textContent = text;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = 'toast'; }, isErr ? 6000 : 3000);
}

/* ---------------- auth ---------------- */

function saveSession(s) {
  session = s;
  try { localStorage.setItem(STORE, JSON.stringify(s)); } catch {}
}
function loadSession() {
  try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch { return null; }
}
function clearSession() {
  session = null;
  try { localStorage.removeItem(STORE); } catch {}
}

async function authFetch(grant, body) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_PUBLISHABLE_KEY, 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error_description || json.msg || json.error || 'Sign-in failed.');
  return json;
}

async function refreshSession() {
  if (!session?.refresh_token) return false;
  try {
    const next = await authFetch('refresh_token', { refresh_token: session.refresh_token });
    saveSession(next);
    return true;
  } catch {
    clearSession();
    return false;
  }
}

/* ---------------- api ---------------- */

async function api(action, payload = {}, isRetry) {
  if (!session?.access_token) { showLogin(); throw new Error('Not signed in.'); }
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'content-type': 'application/json', authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ action, ...payload }),
  });
  if ((res.status === 401 || res.status === 403) && !isRetry) {
    if (await refreshSession()) return api(action, payload, true);
    showLogin('Session expired. Sign in again.');
    throw new Error('Session expired.');
  }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `Request failed (${res.status}).`);
  return json;
}

/* ---------------- views ---------------- */

function showLogin(message) {
  clearSession();
  $('appView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  const m = $('loginMsg');
  if (message) { m.textContent = message; m.classList.add('show'); }
  else { m.classList.remove('show'); }
}

async function showApp() {
  $('loginView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  await reload();
}

async function reload() {
  const data = await api('bootstrap');
  state = data;
  $('whoami').textContent = data.user;
  if (!data.stripeConfigured) $('btnSync').title = 'STRIPE_SECRET_KEY is not set in Netlify yet.';
  renderStats();
  renderList();
  if (selectedId) await openClient(selectedId);
}

function renderStats() {
  const cs = state.clients;
  const active = cs.filter((c) => c.status === 'active');
  const mrr = active.reduce((sum, c) => sum + (c.mrr_cents || 0), 0);
  const pipeline = cs.filter((c) => ['lead', 'contacted', 'proposal', 'won'].includes(c.status)).length;
  // Only count what a real client owes. Invoices whose customer was removed
  // from the CRM are not receivable and would inflate this badly.
  const outstanding = state.openInvoices
    .filter((i) => i.client_id)
    .reduce((s, i) => s + (i.amount_due_cents || 0), 0);
  const today = todayISO();
  const due = cs.filter((c) => c.next_action_due && c.next_action_due <= today).length;

  const collected = state.collectedCents || 0;

  // Projected end-of-year = what is already banked, plus current MRR for each
  // whole month left in the year. It deliberately assumes no new clients and
  // no churn — it is a run-rate, not a forecast.
  const now = new Date();
  const monthsLeft = 11 - now.getMonth();
  const projectedEoy = collected + mrr * monthsLeft;

  // Pipeline value is the MRR already attached to clients that have not closed.
  const pipelineValue = cs
    .filter((c) => ['lead', 'contacted', 'proposal', 'won'].includes(c.status))
    .reduce((s, c) => s + (c.mrr_cents || 0), 0);

  $('stats').innerHTML = [
    ['Collected to date', money0(collected), 'accent'],
    [`Projected EOY (${monthsLeft} mo left)`, money0(projectedEoy), 'accent'],
    ['Monthly recurring', money0(mrr), ''],
    ['Pipeline value', money0(pipelineValue), pipelineValue ? 'accent' : ''],
    ['Active clients', active.length, ''],
    ['In pipeline', pipeline, ''],
    ['Outstanding', money0(outstanding), outstanding > 0 ? 'accent' : ''],
    ['Actions due', due, ''],
    ['Prospects waiting', state.prospectCount, ''],
  ].map(([label, value, cls]) =>
    `<div class="stat ${cls}"><b>${esc(value)}</b><small>${esc(label)}</small></div>`).join('');
}

function visibleClients() {
  const q = $('q').value.trim().toLowerCase();
  const f = $('fStatus').value;
  return state.clients.filter((c) => {
    if (f === 'open') {
      if (!['lead', 'contacted', 'proposal', 'won'].includes(c.status)) return false;
    } else if (f && c.status !== f) return false;
    if (!q) return true;
    return [c.business_name, c.contact_name, c.town, c.email, c.client_no, c.plan, c.product]
      .some((v) => v && String(v).toLowerCase().includes(q));
  });
}

function renderList() {
  const list = visibleClients();
  if (!list.length) {
    $('rows').innerHTML = '<div class="empty">No clients match.</div>';
    return;
  }
  $('rows').innerHTML = list.map((c) => `
    <button class="row ${c.id === selectedId ? 'on' : ''}" data-id="${c.id}">
      <div class="name">${esc(c.business_name)}<span class="no">${esc(c.client_no)}</span></div>
      <div class="sub">
        <span class="pill ${esc(c.status)}">${esc(c.status)}</span>
        ${c.town ? `<span>${esc(c.town)}${c.state ? ', ' + esc(c.state) : ''}</span>` : ''}

        <div class="f"><label>Status</label><select data-f="status">${opts(STATUSES, c.status)}</select></div>

        <div class="f"><label>Term</label><select data-f="term">${opts(TERMS, c.term)}</select></div>

/* ---------------- expenses & mileage ---------------- */

const CATEGORIES = [
  'Software / SaaS', 'Hosting / Domains', 'Advertising', 'Equipment',
  'Office supplies', 'Travel', 'Meals', 'Phone / Internet',
  'Professional services', 'Fees / Bank', 'Education', 'Other',
];
const PAY_METHODS = ['', 'Card', 'ACH', 'Check', 'Cash'];

let moneyTab = 'expenses';
let moneyYear = new Date().getFullYear();
let moneyData = null;

function readBase64(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(',')[1]);
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

// Local calendar date — toISOString() would roll over to tomorrow after 8pm EDT.
const todayISO = () => {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
};

async function loadMoney() {
  $('moneyBody').innerHTML = '<div class="empty">Loading…</div>';
  moneyData = await api('money', { year: moneyYear });
  renderYearPicker();
  renderMoneyStats();
  renderMoney();
}

function renderYearPicker() {
  const now = new Date().getFullYear();
  const earliest = moneyData.earliestExpense
    ? Number(moneyData.earliestExpense.slice(0, 4)) : now;
  const years = [];
  for (let y = now; y >= Math.min(earliest, now); y--) years.push(y);
  if (!years.includes(moneyYear)) years.push(moneyYear);
  $('yearPick').innerHTML = years.sort((a, b) => b - a)
    .map((y) => `<option value="${y}" ${y === moneyYear ? 'selected' : ''}>${y}</option>`).join('');
}

const mileageAmount = (t) => Math.round(Number(t.miles) * Number(t.rate_cents));

function renderMoneyStats() {
  const exp = moneyData.expenses;
  const trips = moneyData.mileage;
  const spent = exp.reduce((s, e) => s + (e.amount_cents || 0), 0);
  const miles = trips.reduce((s, t) => s + Number(t.miles || 0), 0);
  const mileageValue = trips.reduce((s, t) => s + mileageAmount(t), 0);
  const owed = exp.filter((e) => e.billable && !e.reimbursed)
    .reduce((s, e) => s + (e.amount_cents || 0), 0);

  $('moneyStats').innerHTML = [
    [`Expenses ${moneyYear}`, money0(spent), 'accent'],
    ['Miles driven', miles.toLocaleString('en-US', { maximumFractionDigits: 1 }), ''],
    ['Mileage value', money0(mileageValue), 'accent'],
    ['Deductible total', money0(spent + mileageValue), ''],
    ['Billable, unreimbursed', money0(owed), owed ? 'accent' : ''],
    ['Missing receipts', exp.filter((e) => !e.receipt_path).length, ''],
  ].map(([label, value, cls]) =>
    `<div class="stat ${cls}"><b>${esc(value)}</b><small>${esc(label)}</small></div>`).join('');
}

function clientOptions(selected) {
  return ['<option value="">— no client —</option>'].concat(
    moneyData.clients.map((c) =>
      `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${esc(c.business_name)}</option>`),
  ).join('');
}

const clientName = (id) =>
  moneyData.clients.find((c) => c.id === id)?.business_name || '—';

function renderMoney() {
  $('moneyTitle').textContent = moneyTab === 'expenses' ? 'Expenses' : 'Mileage';
  document.querySelectorAll('[data-mtab]').forEach((b) =>
    b.classList.toggle('on', b.dataset.mtab === moneyTab));
  if (moneyTab === 'expenses') renderExpenses();
  else renderMileage();
}

function renderExpenses() {
  const rows = moneyData.expenses;
  const total = rows.reduce((s, e) => s + (e.amount_cents || 0), 0);

  $('moneyBody').innerHTML = `
    <div class="entry">
      <div class="f"><label>Date</label><input id="eDate" type="date" value="${todayISO()}"></div>
      <div class="f"><label>Vendor</label><input id="eVendor" placeholder="Netlify, Home Depot…"></div>
      <div class="f"><label>Category</label><select id="eCat">${
        CATEGORIES.map((c) => `<option ${c === 'Software / SaaS' ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="f"><label>Amount ($)</label><input id="eAmt" type="number" step="0.01" min="0" placeholder="0.00"></div>
      <div class="f"><label>Paid by</label><select id="ePay">${
        PAY_METHODS.map((p) => `<option value="${esc(p)}">${esc(p || '—')}</option>`).join('')}</select></div>
      <div class="f"><label>Client</label><select id="eClient">${clientOptions('')}</select></div>
      <div class="f"><label>Description</label><input id="eDesc" placeholder="What it was for"></div>
      <div class="f"><label for="eFile">Receipt</label>
        <input id="eFile" type="file" accept="image/png,image/jpeg,image/webp,application/pdf"></div>
      <div class="f check"><input id="eBill" type="checkbox"><label for="eBill">Bill to client</label></div>
      <div class="f go"><button class="btn primary" id="eAdd">Add expense</button></div>
    </div>

    <div class="scroll-x">${rows.length ? `<table class="tbl">
      <thead><tr><th>Date</th><th>Vendor</th><th>Category</th><th>Client</th><th>Paid by</th>
        <th class="num">Amount</th><th>Receipt</th><th>Billable</th><th></th></tr></thead>
      <tbody>${rows.map((e) => `<tr>
        <td>${esc(date(e.spent_on))}</td>
        <td>${esc(e.vendor)}${e.description ? `<br><small style="color:var(--muted)">${esc(e.description)}</small>` : ''}</td>
        <td>${esc(e.category)}</td>
        <td>${esc(clientName(e.client_id))}</td>
        <td>${esc(e.payment_method || '—')}</td>
        <td class="num">${esc(money(e.amount_cents))}</td>
        <td class="rcell">${e.receipt_path
          ? `<button class="btn sm rcpt" data-rcpt="${esc(e.receipt_path)}">View receipt</button>
             <label class="btn sm ghost" title="Swap in a different file">Replace<input type="file" hidden
               data-upl="${e.id}" accept="image/png,image/jpeg,image/webp,application/pdf"></label>
             <button class="btn sm ghost danger" data-rmrcpt="${e.id}" title="Remove this receipt">Remove</button>`
          : `<label class="btn sm ghost upl" title="No receipt on this one yet">Attach<input type="file" hidden
               data-upl="${e.id}" accept="image/png,image/jpeg,image/webp,application/pdf"></label>`}</td>
        <td>${e.billable ? (e.reimbursed
          ? '<span class="pill paid">reimbursed</span>'
          : `<button class="btn sm" data-reimb="${e.id}">Mark reimbursed</button>`) : '—'}</td>
        <td><button class="btn sm ghost danger" data-delx="${e.id}">Delete</button></td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="5">${rows.length} expense${rows.length === 1 ? '' : 's'} in ${moneyYear}
        · ${rows.filter((e) => e.receipt_path).length} of ${rows.length} with a receipt</td>
        <td class="num tot">${esc(money(total))}</td><td colspan="3"></td></tr></tfoot>
    </table>` : '<div class="empty">No expenses logged for this year yet.</div>'}</div>`;

  $('eAdd').addEventListener('click', async () => {
    const btn = $('eAdd');
    const dollars = Number($('eAmt').value);
    if (!$('eVendor').value.trim()) return toast('Vendor is required.', true);
    if (!Number.isFinite(dollars) || dollars <= 0) return toast('Enter an amount.', true);
    const file = $('eFile').files?.[0] || null;
    if (file && file.size > 25 * 1024 * 1024) return toast('That receipt is over 25MB.', true);

    btn.disabled = true;
    btn.textContent = file ? 'Saving + uploading…' : 'Saving…';
    try {
      const { expense } = await api('add_expense', {
        spent_on: $('eDate').value,
        vendor: $('eVendor').value,
        category: $('eCat').value,
        amount_cents: Math.round(dollars * 100),
        payment_method: $('ePay').value,
        client_id: $('eClient').value || null,
        description: $('eDesc').value,
        billable: $('eBill').checked,
      });

      if (file) {
        // The row exists now, so a failed upload leaves the expense intact
        // rather than losing what was typed.
        try {
          await api('upload_receipt', {
            expense_id: expense.id,
            filename: file.name,
            content_type: file.type,
            data_base64: await readBase64(file),
          });
          toast(`Expense logged with ${file.name}.`);
        } catch (err) {
          toast(`Expense saved, but the receipt did not upload: ${err.message}`, true);
        }
      } else {
        toast('Expense logged — no receipt attached.');
      }
      await loadMoney();
    } finally {
      btn.disabled = false;
      btn.textContent = 'Add expense';
    }
  });

  $('moneyBody').querySelectorAll('[data-delx]').forEach((el) =>
    el.addEventListener('click', async () => {
      if (!confirm('Delete this expense?')) return;
      await api('delete_expense', { id: el.dataset.delx });
      await loadMoney();
    }));

  $('moneyBody').querySelectorAll('[data-reimb]').forEach((el) =>
    el.addEventListener('click', async () => {
      await api('save_expense', { id: el.dataset.reimb, reimbursed: true });
      toast('Marked reimbursed.');
      await loadMoney();
    }));

  // Receipts are private; ask the server for a short-lived signed link.
  $('moneyBody').querySelectorAll('[data-rcpt]').forEach((el) =>
    el.addEventListener('click', async () => {
      const { url } = await api('receipt_url', { path: el.dataset.rcpt });
      window.open(url, '_blank', 'noopener');
    }));

  $('moneyBody').querySelectorAll('[data-rmrcpt]').forEach((el) =>
    el.addEventListener('click', async () => {
      if (!confirm('Remove this receipt? The file is deleted permanently.')) return;
      await api('delete_receipt', { expense_id: el.dataset.rmrcpt });
      toast('Receipt removed.');
      await loadMoney();
    }));

  $('moneyBody').querySelectorAll('[data-upl]').forEach((el) =>
    el.addEventListener('change', async () => {
      const file = el.files?.[0];
      if (!file) return;
      if (file.size > 25 * 1024 * 1024) return toast('That file is over 25MB.', true);
      toast(`Uploading ${file.name}…`);
      await api('upload_receipt', {
        expense_id: el.dataset.upl,
        filename: file.name,
        content_type: file.type,
        data_base64: await readBase64(file),
      });
      toast('Receipt attached.');
      await loadMoney();
    }));
}

        <th class="num">Miles</th><th class="num">Rate</th><th class="num">Value</th><th></th></tr></thead>
      <tbody>${rows.map((t) => `<tr>
        <td>${esc(date(t.drove_on))}</td>
        <td>${esc(t.purpose)}${t.round_trip ? '<br><small style="color:var(--muted)">round trip</small>' : ''}</td>
        <td>${esc(t.from_place || '—')} → ${esc(t.to_place || '—')}</td>
        <td>${esc(clientName(t.client_id))}</td>
        <td class="num">${Number(t.miles).toFixed(1)}</td>
        <td class="num">${Number(t.rate_cents).toFixed(1)}¢</td>
        <td class="num">${esc(money(mileageAmount(t)))}</td>
        <td><button class="btn sm ghost danger" data-delm="${t.id}">Delete</button></td>
      </tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="4">${rows.length} trip${rows.length === 1 ? '' : 's'} in ${moneyYear}</td>
        <td class="num tot">${totalMiles.toFixed(1)}</td><td></td>
        <td class="num tot">${esc(money(totalValue))}</td><td></td></tr></tfoot>
    </table>` : '<div class="empty">No trips logged for this year yet.</div>'}</div>`;

  $('mAdd').addEventListener('click', async () => {
    let miles = Number($('mMiles').value);
    if (!$('mPurpose').value.trim()) return toast('Purpose is required.', true);
    if (!Number.isFinite(miles) || miles <= 0) return toast('Enter the miles driven.', true);
    const roundTrip = $('mRound').checked;
    if (roundTrip) miles *= 2;
    await api('add_mileage', {
      drove_on: $('mDate').value,
      purpose: $('mPurpose').value,
      from_place: $('mFrom').value,
      to_place: $('mTo').value,
      miles,
      rate_cents: Number($('mRate').value),
      round_trip: roundTrip,
      client_id: $('mClient').value || null,
    });
    toast(`Trip logged — ${miles.toFixed(1)} miles.`);
    await loadMoney();
  });

  $('mSaveRate').addEventListener('click', async () => {
    await api('set_setting', { key: 'mileage_rate_cents', value: $('mRate').value });
    toast(`Default rate saved as ${$('mRate').value}¢ per mile.`);
    await loadMoney();
  });

  $('moneyBody').querySelectorAll('[data-delm]').forEach((el) =>
    el.addEventListener('click', async () => {
      if (!confirm('Delete this trip?')) return;
      await api('delete_mileage', { id: el.dataset.delm });
      await loadMoney();
    }));
}

/* ---------------- new client ---------------- */

async function newClient() {
  const name = prompt('Business name');
  if (!name?.trim()) return;
  const { client } = await api('create_client', { business_name: name.trim(), source: 'manual' });
  toast(`Created ${client.client_no}.`);
  await reload();
  detailTab = 'details';
  await openClient(client.id);
}

/* ---------------- wiring ---------------- */

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('loginBtn');
  const msg = $('loginMsg');
  msg.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const s = await authFetch('password', {
      email: $('email').value.trim(),
      password: $('password').value,
    });
    saveSession(s);
    $('password').value = '';
    await showApp();
  } catch (err) {
    msg.textContent = err.message;
    msg.classList.add('show');
    clearSession();
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});

$('btnOut').addEventListener('click', () => { selectedId = null; showLogin(); });
$('btnNew').addEventListener('click', () => newClient().catch((e) => toast(e.message, true)));
$('btnProspects').addEventListener('click', () => openProspects().catch((e) => toast(e.message, true)));
$('prospectClose').addEventListener('click', () => $('prospectDlg').close());

$('btnSync').addEventListener('click', async () => {
  const btn = $('btnSync');
  btn.disabled = true;
  btn.textContent = 'Syncing…';
  try {
    const r = await api('sync_stripe');
    if (r.ok === false) toast(r.message, true);
    else {
      toast(`Stripe synced — ${r.customers} customers, ${r.subscriptions} subscriptions, ${r.invoices} invoices`
        + `${r.created ? `, ${r.created} new client${r.created === 1 ? '' : 's'}` : ''}`
        + `${r.linked ? `, ${r.linked} linked` : ''}.`);
      await reload();
    }
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sync Stripe';
  }
});

$('q').addEventListener('input', renderList);
$('fStatus').addEventListener('change', renderList);

document.querySelectorAll('.vbtn').forEach((b) => b.addEventListener('click', async () => {
  const view = b.dataset.view;
  document.querySelectorAll('.vbtn').forEach((x) => x.classList.toggle('on', x === b));
  $('clientsView').classList.toggle('hidden', view !== 'clients');
  $('moneyView').classList.toggle('hidden', view !== 'money');
  $('clientTools').classList.toggle('hidden', view !== 'clients');
  if (view === 'money') await loadMoney().catch((e) => toast(e.message, true));
}));

document.querySelectorAll('[data-mtab]').forEach((b) => b.addEventListener('click', () => {
  moneyTab = b.dataset.mtab;
  renderMoney();
}));

$('yearPick').addEventListener('change', async () => {
  moneyYear = Number($('yearPick').value);
  await loadMoney().catch((e) => toast(e.message, true));
});

window.addEventListener('unhandledrejection', (e) => {
  if (e.reason?.message) toast(e.reason.message, true);
});

(async function boot() {
  session = loadSession();
  if (!session?.access_token) { showLogin(); return; }
  try {
    await showApp();
  } catch {
    if (await refreshSession()) {
      try { await showApp(); return; } catch {}
    }
    showLogin();
  }
})();
</script>
</body>
</html>
