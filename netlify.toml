# Netlify config for ainovations.net.
# NOTE: publish dir / build command stay controlled by the Netlify UI (this is a
# static site published from the repo root) — this file only declares the
# serverless functions dir so the chatbot backend deploys with the site.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Clean API path -> the chat function (the widget posts here).
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# Internal CRM back office.
[[redirects]]
  from = "/api/crm"
  to = "/.netlify/functions/crm"
  status = 200

# Keep the back office out of every index, even if a URL leaks.
[[headers]]
  for = "/crm/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
