<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#071c2f" />
<title>Spot Claimed | Rent-a-Site by AInovations</title>
<style>
:root{
  --bg:#05121f; --bg-deep:#030b14; --text:#f7fbff; --muted:#b8cad7; --teal:#1dc8c6; --teal-soft:#72e6df;
  --border:rgba(255,255,255,.13); --ink:#071c2f;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;color:var(--text);
  background:radial-gradient(circle at 12% 4%,rgba(29,200,198,.2),transparent 26%),radial-gradient(circle at 86% 12%,rgba(70,166,255,.15),transparent 24%),linear-gradient(180deg,#09263b 0%,var(--bg) 46%,var(--bg-deep) 100%);}
.card{max-width:640px;padding:clamp(34px,6vw,60px);border:1px solid rgba(114,230,223,.25);border-radius:28px;background:rgba(255,255,255,.05);box-shadow:0 28px 80px rgba(0,0,0,.38);text-align:center}
.check{display:inline-grid;place-items:center;width:64px;height:64px;margin-bottom:22px;border-radius:50%;background:rgba(29,200,198,.14);color:var(--teal-soft);font-size:30px}
h1{margin:0;font-size:clamp(28px,5vw,42px);letter-spacing:-.04em;line-height:1.05}
p{margin:16px auto 0;max-width:44ch;color:var(--muted);font-size:17px;line-height:1.6}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:30px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;border-radius:14px;font-weight:850;font-size:16px;text-decoration:none}
a.primary{background:var(--teal);color:#03212a}
a.ghost{border:1px solid var(--border);background:rgba(255,255,255,.05);color:#fff}
</style>
</head>
<body>
  <a href="/" style="display:block;padding:18px 24px"><img src="/ainovations-logo-header.png" alt="AInovations" style="height:32px;width:auto" /></a>
<main class="card">
  <div class="check" aria-hidden="true">✓</div>
  <h1>Got it — your spot request is in.</h1>
  <p>Your Rent-a-Site request is on its way to <strong>jp@ainovations.net</strong>. We'll get back to you, usually within one business day, with questions and next steps for your new site.</p>
  <div class="btns">
    <a class="btn primary" href="/rent-a-site">Back to Rent-a-Site</a>
    <a class="btn ghost" href="/">AInovations home</a>
  </div>
</main>
</body>
</html>
